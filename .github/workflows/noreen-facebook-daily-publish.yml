name: Noreen Kids Facebook Page 24/7 Daily Schedule (SHORT Reel + LONG Video + 3D Photo Challenge & Comment Auto-Replier)

on:
  schedule:
    # Runs daily at 00:05 Egypt Time using timezone-aware scheduling
    - cron: '5 0 * * *'
      timezone: "Africa/Cairo"
    # Runs daily at 23:16 Egypt Time using timezone-aware scheduling
    - cron: '0 16 * * *'
      timezone: "Africa/Cairo"
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'اختر وضع التشغيل والرفع على صفحة فيسبوك (الجدولة اليومية / قصير فقط / طويل فقط / الاثنين معاً / المنشور التفاعلي المصور والتعليقات)'
        required: true
        type: choice
        default: 'daily_schedule (الجدولة اليومية: قصير + طويل)'
        options:
          - 'daily_schedule (الجدولة اليومية: قصير + طويل)'
          - 'short_only (تشغيل قصير فقط - Short 9:16)'
          - 'long_only (تشغيل طويل فقط - Long 16:9)'
          - 'both_now (تشغيل الاثنين معاً: قصير + طويل)'
          - 'engagement_only (المنشور التفاعلي المصور 3D + فحص التعليقات والرد التلقائي)'

jobs:
  publish-noreen-facebook-daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    concurrency:
      group: noreen-facebook-daily-publish-workflow
      cancel-in-progress: false
    steps:
      - name: 1. Checkout Noreen Kids 3D Studio Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install FFmpeg, ffprobe & Gemini Live Native Audio SDK (@google/genai)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends ffmpeg
          else
            echo "✅ FFmpeg & ffprobe pre-installed: $(ffmpeg -version | head -n 1)"
          fi
          npm install --no-save @google/genai msedge-tts

      - name: 4. Run Pre-Upload Short Pipeline Unit Test Gate (Duration 60-80s, Egyptian Dialogue, Zero External Images)
        run: |
          node tests/short-pipeline-unit-test.mjs

      - name: 5. Render 3D Episode MP4 + Cover & Publish to Facebook Page (and Unified YouTube if enabled)
        env:
          PUBLISH_TARGET: 'facebook_workflow'
          RUN_MODE: ${{ github.event.inputs.run_mode || 'daily_schedule' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APP_URL: ${{ secrets.APP_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || '1330185823512542' }}
        run: |
          node scripts/noreen-kids-youtube-runner.mjs
