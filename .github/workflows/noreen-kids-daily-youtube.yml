name: Noreen Kids 24/7 Daily YouTube Schedule (Short + Long 3D)

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'اختر وضع التشغيل والرفع على يوتيوب (الجدولة اليومية / قصير فقط / طويل فقط / الاثنين معاً)'
        required: true
        type: choice
        default: 'daily_schedule (الجدولة اليومية: قصير + طويل)'
        options:
          - 'daily_schedule (الجدولة اليومية: قصير + طويل)'
          - 'short_only (تشغيل قصير فقط - Short 9:16)'
          - 'long_only (تشغيل طويل فقط - Long 16:9)'
          - 'both_now (تشغيل الاثنين معاً: قصير + طويل)'

jobs:
  generate-and-upload-noreen-kids:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 1. Checkout Noreen Kids 3D Studio Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install FFmpeg & ffprobe for H.264 + AAC-LC + FastStart MP4 Rendering
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: 4. Generate 3D Episode, Synthesize Arabic Voiceover, Render MP4 & Upload to YouTube
        env:
          RUN_MODE: ${{ github.event.inputs.run_mode || 'daily_schedule' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          APP_URL: ${{ secrets.APP_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          node scripts/noreen-kids-youtube-runner.mjs
